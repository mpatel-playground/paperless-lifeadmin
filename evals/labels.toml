# Answer key for the synthetic eval set. Every name, number and date here is made up.
#
# Labelled fields (what extraction must get right): kind, holder, issue_date, expiry_date.
# Other fields only feed the renderer (`number`, `birth_date`, `sex`, `lang`).
# A missing date means the document doesn't have one; extraction should return null.
# `lang = "fr"` renders French labels first, as on Quebec-style bilingual layouts.
#
# Regenerate the images with `make samples` after editing.

