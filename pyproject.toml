[project]
name = "paperless-lifeadmin"
version = "0.1.0"
description = "Self-hosted Paperless-ngx add-on that tracks document expiry dates and sends reminders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pillow>=13.0",  # renders the synthetic eval samples
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeadmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the eval scripts as the `evals` package.
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear (likely bugs),
# UP: modern Python syntax, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
